[package]

name = "o"
version = "0.0.1"
edition = "2021"
authors = ["Palash Tyagi (https://github.com/Magnus167)"]
description = "A customizable command line system monitor."
license = "MIT"
repository = "https://github.com/Magnus167/o"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["monitoring", "cli", "top", "tui"]
documentation = "https://docs.rs/o"
homepage = "https://github.com/Magnus167/o"

[dependencies]
sysinfo = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
owo-colors = "4"
