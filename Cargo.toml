[package]

name = "o"
version = "0.0.1"
edition = "2021"
authors = ["Palash Tyagi (https://github.com/Magnus167)"]
description = "A customizable command line system monitor."
license = "MIT"
repository = "https://github.com/Magnus167/o"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["monitoring", "cli", "top", "tui"]
documentation = "https://docs.rs/o"
homepage = "https://github.com/Magnus167/o"

[dependencies]
sysinfo = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
owo-colors = "4"
clap = { version = "4.5", features = ["derive", "wrap_help", "color", "env"] }
ratatui = { version = "0.27", optional = true, default-features = false, features = [
    "crossterm",
] }
crossterm = "0.27"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Performance",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[features]
default = ["tui"]
tui = ["dep:ratatui"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
